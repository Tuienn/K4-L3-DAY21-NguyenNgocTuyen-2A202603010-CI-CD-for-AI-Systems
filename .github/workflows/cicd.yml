name: Income Model CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'data/**.dvc'
      - '.dvc/config'
      - 'src/**.py'
      - 'scripts/**.py'
      - 'tests/**.py'
      - 'params.yaml'
      - 'requirements.txt'
      - 'requirements-serve.txt'
      - '.github/workflows/cicd.yml'
  workflow_dispatch:
    inputs:
      quality_gate_demo:
        description: 'Use weak parameters to demonstrate that Release is blocked'
        type: boolean
        default: false

permissions:
  contents: read

# Serialize releases so an older run cannot overwrite a newer accepted model.
concurrency:
  group: income-api-main
  cancel-in-progress: false

env:
  MLFLOW_TRACKING_URI: sqlite:///mlflow.db
  MLFLOW_ARTIFACT_ROOT: ./mlartifacts
  MLFLOW_EXPERIMENT_NAME: adult-income-ci

jobs:
  unit-test:
    name: Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run unit tests
        run: python -m pytest tests/ -v

  train:
    name: Train
    needs: unit-test
    runs-on: ubuntu-latest
    outputs:
      f1: ${{ steps.read_report.outputs.f1 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Pull data with DVC from Azure
        env:
          AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.STORAGE_CREDENTIALS }}
        run: dvc pull data/train_batch1.csv.dvc data/holdout.csv.dvc
      - name: Train model
        env:
          QUALITY_GATE_DEMO: ${{ inputs.quality_gate_demo || false }}
        run: python scripts/train_ci.py
      - name: Read report
        id: read_report
        run: |
          python - <<'PY'
          import json, os
          with open('outputs/report.json') as f:
              report = json.load(f)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"f1={report['f1_score']}\n")
          print(json.dumps(report, indent=2))
          PY
      - name: Save report
        uses: actions/upload-artifact@v4
        with:
          name: report
          path: outputs/report.json
          if-no-files-found: error
      - name: Save candidate model
        uses: actions/upload-artifact@v4
        with:
          name: candidate-model
          path: models/model.joblib
          if-no-files-found: error

  quality-gate:
    name: Quality Gate
    needs: train
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check positive-class F1
        env:
          CANDIDATE_F1: ${{ needs.train.outputs.f1 }}
        run: python scripts/quality_gate.py "$CANDIDATE_F1"

  release:
    name: Release
    needs: quality-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: candidate-model
          path: models
      - uses: actions/download-artifact@v4
        with:
          name: report
          path: outputs
      - name: Install Azure SDK
        run: pip install azure-storage-blob==12.19.1
      - name: Copy serving code to Azure VM
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          fingerprint: ${{ vars.SERVER_HOST_FINGERPRINT }}
          source: src/serve.py,requirements-serve.txt
          target: /home/${{ secrets.SERVER_USER }}/
          overwrite: true
      - name: Publish accepted model to Azure
        env:
          AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.STORAGE_CREDENTIALS }}
          ARTIFACT_BUCKET: ${{ secrets.ARTIFACT_BUCKET }}
        run: python scripts/upload_model.py
      - name: SSH deploy to Azure VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          fingerprint: ${{ vars.SERVER_HOST_FINGERPRINT }}
          script: |
            set -eu
            /home/azureuser/bootstrap/bin/uv pip install --python /home/azureuser/.venv/bin/python -r /home/azureuser/requirements-serve.txt
            sudo -n systemctl restart income-api
            for attempt in $(seq 1 30); do
              if curl --fail --silent --show-error --max-time 3 http://127.0.0.1:8080/healthz; then
                echo 'Health check passed'
                exit 0
              fi
              sleep 2
            done
            echo 'Health check failed'
            exit 1
